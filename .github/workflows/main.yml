name: Build REACTFLOW Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout REACTFLOW Source
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle Execute Permission
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            echo "ERROR: Gradle wrapper (gradlew) was not found."
            echo "Check that the Android project includes its Gradle wrapper."
            exit 1
          fi

      - name: Verify Android Project
        run: |
          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            echo "ERROR: Android app Gradle file not found."
            echo "Expected android/app/build.gradle or build.gradle.kts."
            exit 1
          fi

          echo "Android project files found."

      - name: Build REACTFLOW Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
        working-directory: android

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated at the expected path."
            find android -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh "$APK"

      - name: Upload REACTFLOW Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: REACTFLOW-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
