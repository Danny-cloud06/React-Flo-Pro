name: Build REACTFLOW Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout REACTFLOW
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android Project
        id: locate
        shell: bash
        run: |
          echo "Repository contents:"
          ls -la

          if [ -f "./gradlew" ]; then
            echo "project_root=." >> "$GITHUB_OUTPUT"
          elif [ -f "./android/gradlew" ]; then
            echo "project_root=android" >> "$GITHUB_OUTPUT"
          else
            echo "No Gradle wrapper found."
            echo "Searching for Gradle project files..."
            find . -maxdepth 5 \
              \( -name build.gradle -o -name build.gradle.kts \) \
              -print

            echo "A valid Gradle wrapper must be generated or restored."
            exit 1
          fi

      - name: Make Gradle Wrapper Executable
        shell: bash
        run: |
          chmod +x "${{ steps.locate.outputs.project_root }}/gradlew"

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_root }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: REACTFLOW-debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
